line-length = 88
target-version = "py312"

[format]
line-ending = "native"
quote-style = "single"
indent-style = "space"

[lint]
select = [
    "F",
    "E",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PERF",
    "PTH",
    "RET",
    "TRY",
    "ARG",
    "D",
    "N",
    "PLC",
    "PLE",
    "PLW",
    "RUF",
    "S",
    "FAST",
    "A",
    "PT",
    "ASYNC",
    "SLOT",
    "DTZ",
    "LOG",
    "COM",
    "ISC",
    "G",
    "ICN",
    "T20",
]
ignore = [
    "D100",
    "D104",
    "D107",
    "D203",
    "D213",
    "D417",
    "SLOT000",
]

[lint.per-file-ignores]
"typings/*" = ["ALL"]
"tests/*" = ["ARG", "S101", "D", "S105"]
"cogs-legacy/*" = ["ALL"]
"src/poxbot/legacy_cogs/**" = ["ALL"]
"src/poxbot/platforms/discord/extensions/*" = ["D", "RET503"]

[lint.pycodestyle]
max-doc-length = 128

[lint.pydocstyle]
convention = "google"

[lint.flake8-copyright]
author = "p0x38"
