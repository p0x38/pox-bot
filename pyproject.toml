[project]
name = "pox-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "p0x38" }
]
urls = { Repository = "https://github.com/p0x38/p0x-bot" }
dependencies = [
    "aiocache>=0.12.3",
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.2",
    "aiomysql>=0.3.2",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.31.0",
    "attr>=0.3.2",
    "discord-py[voice]>=2.6.4",
    "distro>=1.9.0",
    "edge-tts>=7.2.3",
    "fluent-runtime>=0.4.0",
    "gtts>=2.5.4",
    "i18nice>=0.16.0",
    "lmstudio>=1.5.0",
    "markovify>=0.9.4",
    "matplotlib>=3.10.7",
    "mcstatus>=12.0.6",
    "minepi>=0.5.0",
    "moviepy>=1.0.3",
    "numexpr>=2.14.1",
    "ollama>=0.6.1",
    "openai>=2.33.0",
    "openrouter>=0.9.1",
    "orjson>=3.11.8",
    "pillow>=12.0.0",
    "piper-tts>=1.3.0",
    "pocket-tts>=2.1.0",
    "profanityfilter>=2.1.0",
    "proglog>=0.1.12",
    "prompt-toolkit>=3.0.52",
    "psutil>=7.2.2",
    "pymojang>=2.0.6",
    "pyqt6>=6.10.2",
    "pyqtgraph>=0.14.0",
    "python-dotenv>=1.2.1",
    "pytz>=2025.2",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
    "rich>=14.2.0",
    "roblox>=2.0.0",
    "soundfile>=0.13.1",
    "thefuzz>=0.22.1",
    "tldextract>=5.3.1",
    "urlextract>=1.9.0",
    "websockets>=15.0.1",
    "pyicu>=2.16.2",
    "pyttsx3>=2.99",
    "mecab-python3>=1.0.12",
    "ipadic>=1.0.0",
    "wordcloud>=1.9.6",
    "janome>=0.5.0",
    "nltk>=3.9.4",
    "pet-pet-gif-fork",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "ffmpeg-python>=0.2.0",
    "prometheus-client>=0.25.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-asyncpg",
    "opentelemetry-exporter-prometheus>=0.64b0",
]

[dependency-groups]
dev = [
    { include-group = "dep" },
    { include-group = "vcs" },
]
ci = [
    { include-group = "lint" },
    { include-group = "test" },
]
dep = [
    "dependency-checker>=0.0.5",
    "deptry>=0.25.1",
    "fawltydeps>=0.20.0",
    "pip-audit>=2.10.0",
    "pipdeptree>=2.35.1",
]
lint = [
    "ruff>=0.15.12",
]
vcs = [
    "git-cliff>=2.13.1",
]
test = [
    "dpytest>=0.7.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
start = "src.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 128
target-version = "py312"

[tool.ruff.format]
line-ending = "native"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]
"cogs-legacy/*" = ["ALL"]

[tool.uv]
managed = true
default-groups = "all"

[tool.uv.sources]
pyicu = [
  { url = "https://github.com/cgohlke/pyicu-build/releases/download/v2.16.2/pyicu-2.16.2-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.12'" },
  { url = "https://github.com/cgohlke/pyicu-build/releases/download/v2.16.2/pyicu-2.16.2-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.13'" },
]
pet-pet-gif-fork = { git = "https://github.com/p0x38/pet-pet-gif-fork.git" }
