[project]
name = "pox-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "p0x38" }
]
urls = { Repository = "https://github.com/p0x38/p0x-bot" }
dependencies = [
    "aiocache>=0.12.3",
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.2",
    "aiomysql>=0.3.2",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.31.0",
    "attr>=0.3.2",
    "discord-py[voice]>=2.6.4",
    "distro>=1.9.0",
    "edge-tts>=7.2.3",
    "fluent-runtime>=0.4.0",
    "gtts>=2.5.4",
    "i18nice>=0.16.0",
    "lmstudio>=1.5.0",
    "markovify>=0.9.4",
    "matplotlib>=3.10.7",
    "mcstatus>=12.0.6",
    "minepi>=0.5.0",
    "moviepy>=1.0.3",
    "numexpr>=2.14.1",
    "ollama>=0.6.1",
    "openai>=2.33.0",
    "openrouter>=0.9.1",
    "orjson>=3.11.8",
    "pillow>=12.0.0",
    "piper-tts>=1.3.0",
    "pocket-tts>=2.1.0",
    "profanityfilter>=2.1.0",
    "proglog>=0.1.12",
    "prompt-toolkit>=3.0.52",
    "psutil>=7.2.2",
    "pymojang>=2.0.6",
    "pyqt6>=6.10.2",
    "pyqtgraph>=0.14.0",
    "python-dotenv>=1.2.1",
    "pytz>=2025.2",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
    "rich>=14.2.0",
    "roblox>=2.0.0",
    "soundfile>=0.13.1",
    "thefuzz>=0.22.1",
    "tldextract>=5.3.1",
    "urlextract>=1.9.0",
    "websockets>=15.0.1",
    "pyicu>=2.16.2",
    "pyttsx3>=2.99",
    "mecab-python3>=1.0.12",
    "ipadic>=1.0.0",
    "wordcloud>=1.9.6",
    "janome>=0.5.0",
    "nltk>=3.9.4",
    "pet-pet-gif-fork",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "ffmpeg-python>=0.2.0",
    "prometheus-client>=0.25.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-asyncpg",
    "opentelemetry-exporter-prometheus>=0.64b0",
    "msgpack>=1.2.1",
    "python-logging-loki>=0.3.1",
    "numpy>=2.5.0",
    "pydantic==2.13.4",
    "google-re2>=1.1.20251105",
]

[project.optional-dependencies]
cpu = [
    "torch",
]
gpu = [
    "torch",
]

[dependency-groups]
dev = [
    { include-group = "vcs" },
    "pyright>=1.1.411",
]
ci = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.15.12",
]
vcs = [
    "git-cliff>=2.13.1",
]
test = [
    "dpytest>=0.7.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
poxbot = "poxbot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poxbot"]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
managed = true
default-groups = "all"
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
pyicu = [
  { url = "https://github.com/cgohlke/pyicu-build/releases/download/v2.16.2/pyicu-2.16.2-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.12'" },
  { url = "https://github.com/cgohlke/pyicu-build/releases/download/v2.16.2/pyicu-2.16.2-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.13'" },
]
torch = [
  { index = "torch-cpu", extra = "cpu" },
  { index = "torch-gpu", extra = "gpu" },
]
pet-pet-gif-fork = { git = "https://github.com/p0x38/pet-pet-gif-fork.git" }

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
